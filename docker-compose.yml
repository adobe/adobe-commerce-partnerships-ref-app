version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '9000:9000' # HTTPS
      - '8080:8080' # HTTP
    environment:
      NODE_ENV: development
      # Add your environment variables here
    volumes:
      - .:/app
      - ./certs:/app/certs
      - /app/node_modules
    restart: unless-stopped
